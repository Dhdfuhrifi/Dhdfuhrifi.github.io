<!DOCTYPE html>
<html>
<head>
<title>Iframe Loader</title>
<style>
  #iframe-container {
  position: relative;
  width: 800px; /* Adjust as needed */
  height: 600px; /* Adjust as needed */
}

#loader {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 20px;
}

#my-iframe {
  width: 100%;
  height: 100%;
  border: none;
}
</style>
</head>
<body>
  <div id="iframe-container">
    <div id="loader">Loading...</div>
    <iframe id="my-iframe" src="" style="display:none;"></iframe>
  </div>
  <script>
    const iframe = document.getElementById('my-iframe');
const loader = document.getElementById('loader');

iframe.onload = () => {
  loader.style.display = 'none';
  iframe.style.display = 'block';
};

iframe.src = 'https://dhdfuhrifi.github.io'; // Replace with your desired URL
  </script>
</body>
</html>
